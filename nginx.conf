server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Single Page Application: forward all unmatched routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache index.html so updates are visible immediately on reload
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Flutter Web service worker / bootstrap
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        expires 0;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        expires 0;
    }

    # Cache static assets (images, fonts, wasm, compiled js)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Lightweight healthcheck for Dokploy & Docker
    location /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"frontend"}\n';
        add_header Content-Type application/json;
    }
}
